name: Deploy nyovara to cPanel

# push to main    -> live    (/nyovara.nyotacoreltd.com)
# push to staging -> staging (/staging.nyovara.nyotacoreltd.com)
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build --if-present

      - name: Locate build output
        id: out
        run: |
          set -e
          DIR="${{ vars.BUILD_DIR }}"
          if [ -z "$DIR" ]; then
            for d in dist build out; do
              if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then DIR="$d"; break; fi
            done
          fi
          if [ -z "$DIR" ] || [ ! -d "$DIR" ]; then
            echo "Could not find build output (looked for dist/build/out)."
            echo "Set a repo Variable BUILD_DIR to your output folder and re-run."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing from: $DIR"
          ls -A "$DIR"

      - name: SPA routing fallback (.htaccess)
        run: |
          cat > "${{ steps.out.outputs.dir }}/.htaccess" <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Choose target directory
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=${{ secrets.FTP_LIVE_DIR }}"    >> "$GITHUB_OUTPUT"
            echo "env=LIVE"                            >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ secrets.FTP_STAGING_DIR }}" >> "$GITHUB_OUTPUT"
            echo "env=STAGING"                         >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ steps.target.outputs.env }} via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_HOST }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       ${{ vars.FTP_PORT || 21 }}
          protocol:   ftps
          local-dir:  ./${{ steps.out.outputs.dir }}/
          server-dir: ${{ steps.target.outputs.dir }}
          state-name: .ftp-deploy-state.json

      - name: Summary
        run: |
          echo "Deployed **${{ steps.target.outputs.env }}** from \`${{ github.ref_name }}\` (build: ${{ steps.out.outputs.dir }}) to \`${{ steps.target.outputs.dir }}\`" >> "$GITHUB_STEP_SUMMARY"