name: Deploy nyovara to cPanel

# push to main    -> live    (/nyovara.nyotacoreltd.com)
# push to staging -> staging (/staging.nyovara.nyotacoreltd.com)
# Static multi-page site: no build step, files are uploaded as-is.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble publish folder
        run: |
          set -e
          rm -rf publish && mkdir publish
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools' \
            --exclude='publish' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            --exclude='.ftp-deploy-state.json' \
            ./ publish/
          echo "---- publish/ contents ----"
          ls -A publish

      - name: Choose target directory
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=${{ secrets.FTP_LIVE_DIR }}"    >> "$GITHUB_OUTPUT"
            echo "env=LIVE"                            >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ secrets.FTP_STAGING_DIR }}" >> "$GITHUB_OUTPUT"
            echo "env=STAGING"                         >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy ${{ steps.target.outputs.env }} via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_HOST }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       ${{ vars.FTP_PORT || 21 }}
          protocol:   ftps
          local-dir:  ./publish/
          server-dir: ${{ steps.target.outputs.dir }}
          state-name: .ftp-deploy-state.json

      - name: Summary
        run: |
          echo "Deployed **${{ steps.target.outputs.env }}** from \`${{ github.ref_name }}\` to \`${{ steps.target.outputs.dir }}\`" >> "$GITHUB_STEP_SUMMARY"
